version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # hey-api crashes on ts.SyntaxKind under TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The types follow the oldest Node the package supports, so a newer major would type APIs Node 20 lacks.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      dev-tools:
        patterns: ["*"]
        exclude-patterns: ["@hey-api/openapi-ts"]
